name: Make the updater signing key (one time)

# Runs once when this file is pushed. It makes the key pair that signs Lock In updates:
#   - the PUBLIC key is printed in the log; it goes in desktop/src-tauri/tauri.conf.json
#   - the PRIVATE key is uploaded as a 1-day artifact that only people with access to this
#     private repo can download. Paste it into the TAURI_SIGNING_PRIVATE_KEY secret, keep a
#     backup in a password manager, then delete the artifact.
# Nobody else ever sees the private key.

on:
  push:
    paths: [".github/workflows/desktop-make-key.yml"]
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the key pair
        run: npx -y @tauri-apps/cli@2.12.6 signer generate --ci -p "" -w updater.key > /dev/null
      - name: Public key (safe to share)
        run: |
          echo "PUBLIC KEY:"
          cat updater.key.pub
          echo
      - uses: actions/upload-artifact@v4
        with:
          name: updater-private-key
          path: updater.key
          retention-days: 1
