name: Desktop app

on:
  push:
    paths: ["desktop/**", "!desktop/camera/models/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Guard unit tests
        run: cargo test -p lockin-guard
      - name: Build the Guard
        run: cargo build -p lockin-guard --release
      - name: Guard smoke test (install, block, close a program, uninstall)
        shell: pwsh
        timeout-minutes: 12
        run: |
          Copy-Item guard/windivert/WinDivert.dll, guard/windivert/WinDivert64.sys target/release/
          try { ./scripts/smoke.ps1 } finally { Get-Content "$env:ProgramData\LockIn\guard.log" -ErrorAction SilentlyContinue | Select-Object -Last 30 }
      - name: Bundle the Guard with the app
        shell: pwsh
        run: Copy-Item target/release/lockin-guard.exe src-tauri/binaries/lockin-guard-x86_64-pc-windows-msvc.exe

      - name: Camera models and ONNX Runtime (from the camera-models-1 pre-release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/camera-assets.ps1
      - name: Camera worker unit tests
        run: cargo test -p lockin-camera
      - name: Camera worker has no networking code
        shell: pwsh
        run: ./scripts/check-camera-deps.ps1
      - name: Build the camera worker
        run: cargo build -p lockin-camera --release
      - name: Sandbox blocks the network and personal files
        shell: pwsh
        run: |
          cargo build -p lockin-sandbox --release
          Set-Content "$env:USERPROFILE\Documents\lockin-private.txt" "private"
          ./target/release/sandbox-check.exe probe "$env:USERPROFILE\Documents\lockin-private.txt"
      - name: Camera speed test inside the sandbox, on GitHub's Windows machine (no graphics chip)
        shell: pwsh
        timeout-minutes: 20
        run: |
          # Laid out like the installed app: worker, ONNX Runtime and models in one folder.
          New-Item -ItemType Directory -Force camera-test | Out-Null
          Copy-Item target/release/lockin-camera.exe, camera-assets/onnxruntime.dll, camera-assets/DirectML.dll camera-test/
          New-Item -ItemType Directory -Force camera-test/models | Out-Null
          Copy-Item camera-assets/*.onnx, camera-assets/manifest.json, camera-assets/reference.json camera-test/models/
          $t = (Resolve-Path camera-test).Path
          cmd /c "target\release\sandbox-check.exe run $t\lockin-camera.exe bench --models $t\models --reference $t\models\reference.json --engines cpu1,cpu,gpu < camera-assets\bus.jpg > bench.jsonl"
          $code = $LASTEXITCODE
          Get-Content bench.jsonl | Select-Object -Last 1
          node scripts/bench-summary.mjs bench.jsonl
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-speed-test
          path: desktop/bench.jsonl
          if-no-files-found: ignore
      - name: Bundle the camera worker with the app
        shell: pwsh
        run: Copy-Item target/release/lockin-camera.exe src-tauri/binaries/lockin-camera-x86_64-pc-windows-msvc.exe

      - run: npm ci
      - name: Build the installer
        run: npx tauri build --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: lock-in-test-build
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
