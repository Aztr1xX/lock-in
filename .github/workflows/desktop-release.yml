name: Desktop release

# Push a tag like desktop-v0.1.0 to ship an update. This builds a signed installer and
# publishes it, with latest.json, as a release of this repo. Every installed copy of
# Lock In checks that file and updates itself.
#
# Needs one secret on this repo:
#   TAURI_SIGNING_PRIVATE_KEY  the updater signing key (keep a backup: losing it breaks updates)

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Work out the version from the tag
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".Substring("desktop-v".Length)
          "version=$v" >> $env:GITHUB_OUTPUT
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $v
          $conf | ConvertTo-Json -Depth 20 | Set-Content desktop/src-tauri/tauri.conf.json

      - name: Build the Guard
        working-directory: desktop
        env:
          LOCKIN_VERSION: ${{ steps.v.outputs.version }}
        run: cargo build -p lockin-guard --release
      - name: Bundle the Guard with the app
        working-directory: desktop
        shell: pwsh
        run: Copy-Item target/release/lockin-guard.exe src-tauri/binaries/lockin-guard-x86_64-pc-windows-msvc.exe
      - name: Install packages
        working-directory: desktop
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          tagName: v${{ steps.v.outputs.version }}
          releaseName: Lock In ${{ steps.v.outputs.version }} (in development)
          releaseBody: "In development: an early test build, password protected. Download the setup file below and run it; installed copies update themselves."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
