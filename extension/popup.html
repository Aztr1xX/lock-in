<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="page.css">
<style>
  body { width: 320px; padding: 16px; font-size: 14px; }
  .head { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
  .head img { width: 22px; height: 22px; border-radius: 6px; }
  .status { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .status b { display: block; font-size: 15px; }
  .status span { color: var(--muted); }
  .status.on { border-color: var(--accent); }
  .status.on b { color: var(--accent); }
  h2 { font: 600 11px/1 Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li button { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 0 4px; }
  li button:hover { color: #ff7d8a; }
  li button:disabled { opacity: .3; cursor: not-allowed; }
  form { display: flex; gap: 6px; margin-top: 10px; }
  input { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  form button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 0 14px; font-weight: 700; }
  .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
  <div class="head"><img src="icons/icon-48.png" alt="">Lock In Blocker</div>
  <div class="status" id="status"><b>Checking…</b></div>
  <h2>Blocked during sessions</h2>
  <ul id="sites"></ul>
  <form id="add">
    <input id="newsite" placeholder="Add a site, e.g. discord.com" autocomplete="off">
    <button>Add</button>
  </form>
  <p class="note" id="note">YouTube stays open, but only Education and Science &amp; Technology videos play.</p>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
