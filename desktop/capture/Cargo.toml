[package]
name = "lockin-capture"
version = "0.0.1"
edition = "2021"
description = "Reads frames from a camera with Windows Media Foundation, outside the app window"

[lib]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
