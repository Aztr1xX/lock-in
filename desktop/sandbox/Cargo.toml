[package]
name = "lockin-sandbox"
version = "0.0.1"
edition = "2021"
description = "Starts the camera worker in a Windows AppContainer: no network, no camera, no personal files"

[lib]
path = "src/lib.rs"

# A test program that tries to reach the network and read personal files from inside the
# sandbox; CI runs it to prove the sandbox blocks both. Never shipped.
[[bin]]
name = "sandbox-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "sandbox-check"
path = "src/bin/check.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_Storage_FileSystem",
] }
