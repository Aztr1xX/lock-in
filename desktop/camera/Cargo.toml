[package]
name = "lockin-camera"
version = "0.0.1"
edition = "2021"
description = "Lock In camera worker: runs the camera models on frames it is handed and reports numbers"

[[bin]]
name = "lockin-camera"
path = "src/main.rs"

# Privacy rule: this process must never be able to reach the network. Keep every dependency
# free of networking (CI fails the build if one appears; see scripts/check-camera-deps.ps1).
# ONNX Runtime is loaded from the DLL shipped next to the exe, so nothing is downloaded at build
# or run time.
[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml", "api-24"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = { version = "6.2", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Dxgi", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
