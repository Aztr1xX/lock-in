[package]
name = "lockin-live"
version = "0.0.1"
edition = "2021"
description = "The live camera check: reads the camera, hands frames to the sandboxed worker, turns its answers into here/away/phone"

[lib]
path = "src/lib.rs"

[dependencies]
lockin-capture = { path = "../capture" }
lockin-sandbox = { path = "../sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
