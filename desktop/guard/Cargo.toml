[package]
name = "lockin-guard"
version = "0.0.1"
edition = "2021"
description = "Lock In Guard: blocks sites and closes games during focus rounds"

[[bin]]
name = "lockin-guard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
time = { version = "0.3", default-features = false, features = ["std"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_LibraryLoader"] }
